<style>
/* Layout concept: a road-atlas landing screen (highway guide sign + route map) that leads into a full-grid puzzle board. */
:root {
  --bg: #EDF1F4;
  --surface: #FFFFFF;
  --ink: #14202A;
  --muted: #566673;
  --line: #C9D3DB;
  --water: #D9E5EE;
  --land: #F8F9F6;
  --road: #0E7A53;
  --road-todo: #8796A3;
  --sign: #0B6A47;
  --sign-ink: #FFFFFF;
  --marker: #F4B400;
  --marker-ink: #14202A;
  --board: #1B2630;
  --seam: rgba(10, 18, 26, 0.55);
  --danger: #C23B2E;
  --f-disp: 'Barlow Condensed', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E151B; --surface: #17212A; --ink: #E8EFF4; --muted: #93A4B2; --line: #2A3845;
    --water: #0A1117; --land: #1A252E; --road: #2DBB85; --road-todo: #5A6C7A;
    --sign: #0B6A47; --sign-ink: #FFFFFF; --marker: #FFC21A; --marker-ink: #14202A;
    --board: #0A1015; --seam: rgba(0, 0, 0, 0.6); --danger: #F0857A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E151B; --surface: #17212A; --ink: #E8EFF4; --muted: #93A4B2; --line: #2A3845;
  --water: #0A1117; --land: #1A252E; --road: #2DBB85; --road-todo: #5A6C7A;
  --sign: #0B6A47; --sign-ink: #FFFFFF; --marker: #FFC21A; --marker-ink: #14202A;
  --board: #0A1015; --seam: rgba(0, 0, 0, 0.6); --danger: #F0857A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  padding-inline: 16px; padding-block: 16px 28px;
}
button, label.btn { font: inherit; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font: 700 32px/1 var(--f-disp); letter-spacing: 0.02em; text-transform: uppercase; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.theme-line { margin: 2px 0 0; color: var(--muted); font-size: 14px; font-weight: 600; }

/* Guide sign */
.sign { background: var(--sign); color: var(--sign-ink); border-radius: 10px; padding: 4px; }
.sign-in { border: 2px solid rgba(255, 255, 255, 0.92); border-radius: 7px; padding: 12px 14px; display: grid; gap: 10px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px; }
.srow + .srow { border-top: 1px solid rgba(255, 255, 255, 0.35); padding-top: 10px; }
.slabel { display: block; font: 600 13px/1.2 var(--f-disp); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
.scity { font: 700 32px/1 var(--f-disp); text-wrap: balance; }
.smi { font: 700 32px/1 var(--f-disp); font-variant-numeric: tabular-nums; white-space: nowrap; }
.smi small { font-size: 16px; letter-spacing: 0.06em; margin-left: 3px; }

/* Map */
.mapcard { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--water); }
#mapSvg { display: block; width: 100%; height: auto; }
.m-water { fill: var(--water); }
.m-land { fill: var(--land); stroke: var(--line); stroke-width: calc(1.5px * var(--k, 1)); stroke-linejoin: round; }
.m-todo { fill: none; stroke: var(--road-todo); stroke-width: calc(4px * var(--k, 1)); stroke-dasharray: calc(2px * var(--k, 1)) calc(9px * var(--k, 1)); stroke-linecap: round; stroke-linejoin: round; }
.m-done { fill: none; stroke: var(--road); stroke-width: calc(6px * var(--k, 1)); stroke-linecap: round; stroke-linejoin: round; }
.m-stop { fill: var(--surface); stroke: var(--road-todo); stroke-width: calc(2.5px * var(--k, 1)); }
.m-stop.hit { fill: var(--road); stroke: var(--surface); }
.m-lab { font-family: var(--f-body); font-weight: 600; font-size: calc(18px * var(--k, 1)); fill: var(--ink); paint-order: stroke; stroke: var(--land); stroke-width: calc(4px * var(--k, 1)); stroke-linejoin: round; }
.m-halo { fill: var(--marker); opacity: 0.35; }
.m-mark { fill: var(--marker); stroke: var(--marker-ink); stroke-width: calc(2.5px * var(--k, 1)); }

.trip { margin: 0; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.trip b { color: var(--ink); font-weight: 600; }

/* Buttons */
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { appearance: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--sign); border-color: var(--sign); color: var(--sign-ink); font: 700 22px/1 var(--f-disp); letter-spacing: 0.04em; text-transform: uppercase; padding-inline: 22px; }
.btn.primary:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.btn:focus-visible, .linkbtn:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }
.linkbtn { appearance: none; background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; }

/* Route log */
.logh { margin: 8px 0 0; font: 600 14px var(--f-disp); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.log li { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 15px; }
.log .mm { font: 600 15px var(--f-body); font-variant-numeric: tabular-nums; }
.log .city { color: var(--ink); }
.log .st { font-size: 13px; }
.log li.hit .city { font-weight: 600; }
.log li.hit .st { color: var(--road); font-weight: 600; }
.log li.next .city { font-weight: 600; }
.log li.next .st { color: var(--ink); }

/* Game */
.gbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hud { display: flex; gap: 14px; font: 700 24px/1 var(--f-disp); font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
.hud span:last-child { color: var(--muted); }
.cap { margin: 0; text-align: center; color: var(--muted); font-size: 14px; }
#board { position: relative; margin: 0 auto; background: var(--board); border-radius: 6px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.p { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); transition: transform 0.18s ease; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; }
.p canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.p .e { position: absolute; inset: 0; pointer-events: none; border: 2px solid var(--seam); }
.p.bt .e { border-top-color: transparent; }
.p.br .e { border-right-color: transparent; }
.p.bb .e { border-bottom-color: transparent; }
.p.bl .e { border-left-color: transparent; }
.p.lift { transition: none; cursor: grabbing; --seam: var(--marker); }
.p.rise { z-index: 20; }
.p.snap .e { animation: snap 0.6s ease-out; }
@keyframes snap { 0% { box-shadow: inset 0 0 0 4px var(--marker); } 100% { box-shadow: inset 0 0 0 0 transparent; } }
.g { position: absolute; left: 0; top: 0; width: var(--cw); height: var(--ch); border: 2px dashed var(--marker); background: rgba(244, 180, 0, 0.2); pointer-events: none; z-index: 5; }
.g.bad { border-color: var(--danger); background: rgba(194, 59, 46, 0.28); }
.hint { margin: 0; text-align: center; color: var(--muted); font-size: 14px; min-height: 2.8em; text-wrap: balance; }
.hint.bad { color: var(--danger); font-weight: 600; }

/* Win dialog */
.win { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(8, 14, 18, 0.62); }
.wcard { width: min(420px, 100%); background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.whead { background: var(--sign); color: var(--sign-ink); padding: 14px 18px; }
.wbody { padding: 16px 18px 18px; display: grid; gap: 12px; }
.wbody p { margin: 0; }
.wstat { color: var(--muted); font-variant-numeric: tabular-nums; }
.wphoto { width: 100%; border-radius: 8px; display: block; }
.wcredit { color: var(--muted); font-size: 13px; }
.wact { display: flex; flex-wrap: wrap; gap: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
body.busy .btn { opacity: 0.55; pointer-events: none; }
body.busy #board { pointer-events: none; }

/* Trip menu */
.tripl { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.tripcard { width: 100%; text-align: left; display: grid; gap: 5px; padding: 12px 14px; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; font: inherit; }
.tripcard:hover { border-color: var(--muted); }
.tripcard:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }
.tripcard.cur { border-color: var(--sign); box-shadow: inset 0 0 0 1px var(--sign); }
.tname { font: 700 26px/1 var(--f-disp); text-transform: uppercase; letter-spacing: 0.02em; }
.troute, .tmeta { color: var(--muted); font-size: 15px; }
.ttheme { color: var(--ink); font-size: 14px; font-weight: 600; }
.tbar { display: block; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--road); }
.tstat { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tripcard.done .tstat { color: var(--road); }

@media (max-width: 420px) {
  h1 { font-size: 28px; }
  .scity, .smi { font-size: 28px; }
  .btn.primary { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .p { transition: none; }
  .p.snap .e { animation: none; }
}
</style>

<div class="wrap" id="app">
  <section id="mapView" class="wrap" aria-label="Trip map">
    <header>
      <h1>Puzzle Road Trip</h1>

      <p class="theme-line" id="themeLine"></p>
    </header>
    <div class="sign" aria-live="polite"><div class="sign-in" id="sign"></div></div>
    <div class="mapcard"><svg id="mapSvg" viewBox="0 0 690 395" role="img" aria-label="Trip route map"></svg></div>
    <p class="trip" id="trip"></p>
    <div class="actions" id="actions"></div>
    <h2 class="logh">Route log</h2>
    <ol class="log" id="log"></ol>
    <div><button class="linkbtn" id="resetBtn" type="button">Reset all progress</button></div>
  </section>

  <section id="tripView" class="wrap" hidden aria-label="Choose a trip">
    <header>
      <h1>Choose a trip</h1>
      <p class="sub">Each trip keeps its own progress. Every puzzle you finish drives 100 miles.</p>
    </header>
    <ul class="tripl" id="tripList"></ul>
    <div class="actions"><button class="btn" id="tripsBack" type="button">Back to map</button></div>
  </section>

  <section id="gameView" class="wrap" hidden aria-label="Puzzle">
    <div class="gbar">
      <button class="btn small" id="backBtn" type="button">Map</button>
      <div class="hud"><span id="timer">0:00</span><span id="moves">0 moves</span></div>
      <button class="btn small ghost" id="newBtn" type="button">New puzzle</button>
    </div>
    <p class="cap" id="caption"></p>
    <div id="board" aria-label="Puzzle board, 8 columns by 8 rows"></div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>

  <div class="win" id="win" hidden role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="wcard">
      <div class="whead"><span class="slabel" id="winTitle">Puzzle solved</span></div>
      <div class="wbody">
        <p id="winLine"></p>
        <p class="wstat" id="winStat"></p>
        <img class="wphoto" id="winPhoto" hidden alt="The photo you just solved">
        <p class="wcredit" id="winCredit" hidden></p>
        <div class="wact"><button class="btn primary" id="winTrips" type="button" hidden>Choose next trip</button><button class="btn primary" id="winMap" type="button">Back to map</button><button class="btn" id="winNext" type="button">Next puzzle</button><button class="btn ghost" id="winView" type="button">View puzzle</button></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

    return photo.src + (photo.src.indexOf('?') === -1 ? '?' : '&') + 'w=' + IW + '&h=' + IH + '&fit=crop&crop=entropy&auto=format&q=80';
  }
  // The Unsplash API guidelines ask apps to report when a photo is actually put to use (here:
  // chosen for a puzzle) so the photographer's download count is credited. Fire and forget.
  function trackDownload(photo) {
    if (!photo.dl || !/^https:\/\/api\.unsplash\.com\//.test(photo.dl)) return;
    try { fetch(photo.dl, { headers: { Authorization: 'Client-ID ' + UNSPLASH_ACCESS_KEY, 'Accept-Version': 'v1' } }).catch(function () {}); } catch (e) {}
  }
  // Try with CORS (for scoring), fall back to a plain (unscored) load if the host or network
  // refuses it. The draw still cover-fits, in case a photo comes back at another size.
  function loadUnsplashImage(photo, done) {
    function attempt(cors, next) {
      var im = new Image(), finished = false, to = 0;
      function end(r, timedOut) { if (finished) return; finished = true; clearTimeout(to); next(r, timedOut); }
      if (cors) im.crossOrigin = 'anonymous';
      im.onload = function () {
        try {
          var cv = document.createElement('canvas'); cv.width = IW; cv.height = IH;
          var g = cv.getContext('2d');
          var s = Math.max(IW / im.naturalWidth, IH / im.naturalHeight), w = im.naturalWidth * s, h = im.naturalHeight * s;
          g.drawImage(im, (IW - w) / 2, (IH - h) / 2, w, h);
          end({ canvas: cv, score: cors ? scorePixels(im) : null });
        } catch (e) { end(null); }
      };
      im.onerror = function () { end(null); };
      to = setTimeout(function () { end(null, true); }, 8000);
      im.src = unsplashImageUrl(photo);
    }
    attempt(true, function (r, timedOut) {
      if (r || timedOut) { done(r); return; }
      attempt(false, done);
    });
  }
  // One random query from the trip's theme, a random page of its results, then three photos
  // not used recently on this trip, keeping the one with the most puzzle-friendly detail.
  // done(null) means Unsplash could not produce a usable photo.
  function pickUnsplashPhoto(theme, tripId, done) {
    var query = theme.queries[Math.floor(Math.random() * theme.queries.length)];
    var page = 1 + Math.floor(Math.random() * 5);
    // Wrapped in Promise.resolve().then(...) so that if fetch is entirely unavailable (e.g.
    // the Claude-artifact sandbox, which blocks outside fetches outright) the resulting
    // synchronous throw still lands in the .catch() below instead of escaping uncaught.
    Promise.resolve().then(function () {
      return unsplashSearch(query, page).then(function (photos) {
        // Queries with fewer than `page` pages of results come back empty; use page 1 then.
        return photos.length || page === 1 ? photos : unsplashSearch(query, 1);
      });
    })
      .then(function (photos) {
        var recent = recentIds(tripId);
        var pool = photos.filter(function (p) { return recent.indexOf(p.id) === -1; });
        // Every result was used recently: a repeat still beats a generated scene.
        if (!pool.length) pool = photos.slice();
        var picks = [];
        while (picks.length < 3 && pool.length) picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
        if (!picks.length) { done(null); return; }
        var results = [], pending = picks.length;
        picks.forEach(function (photo) {
          loadUnsplashImage(photo, function (r) {
            results.push(r ? { photo: photo, canvas: r.canvas, score: r.score } : null);
            if (--pending === 0) {
              var best = null;
              results.forEach(function (r2) {
                if (!r2) return;
                r2.rank = r2.score ? r2.score.rank : -1;
                if (!best || r2.rank > best.rank) best = r2;
              });
              done(best);
            }
          });
        });
      })
      .catch(function () { done(null); });
  }

  function begin(g) {
    cleanSlate();
    g.grid = P.shuffle(rng(g.seed ^ 0x9e3779b9));
    g.moves = 0; g.elapsed = 0; g.solved = false;
    openGame(g);
    saveGame();
  }
  function newGame() {
    if (busy) return;
    var seed = Math.floor(Math.random() * 2147483647);
    var theme = T.theme, tripId = T.id;
    function withScene(toastMsg) {
      var sc = makeScene(seed);
      begin({ seed: seed, kind: 'scene', name: sc.name, img: sc.canvas, detail: null });
      showToast(toastMsg, 4500);
    }
    if (!UNSPLASH_ACCESS_KEY) { withScene('No Unsplash key is set (UNSPLASH_ACCESS_KEY in index.html), so this puzzle uses a generated scene.'); return; }
    setBusy(true, 'Picking a ' + theme.name.toLowerCase() + ' photo...');
    var settled = false, timer = setTimeout(function () {
      if (settled) return; settled = true;
      setBusy(false);
      withScene('Photos took too long to load, so this puzzle uses a generated scene.');
    }, 12000);
    pickUnsplashPhoto(theme, tripId, function (best) {
      if (settled) return; settled = true; clearTimeout(timer);
      setBusy(false);
      if (!best) { withScene('Could not load ' + theme.name.toLowerCase() + ' photos, so this puzzle uses a generated scene.'); return; }
      rememberPhoto(tripId, best.photo.id);
      trackDownload(best.photo);
      begin({
        seed: seed, kind: 'unsplash', name: 'Photo', img: best.canvas, detail: best.score ? best.score.score : null,
        photo: best.photo, themeName: theme.name, themeEmoji: theme.emoji
      });
    });
  }
  // Resuming deserves more persistence than picking a fresh photo: the player already has
  // moves and time invested in this exact picture, and returning after a while away often
  // means the device's network is still waking up (Wi-Fi reconnecting, etc.) right when the
  // first attempt runs. Retries the whole attempt a couple of times before giving up.
  function retrying(attemptFn, tries, delayMs, done) {
    attemptFn(function (r) {
      if (r || tries <= 1) { done(r); return; }
      setTimeout(function () { retrying(attemptFn, tries - 1, delayMs, done); }, delayMs);
    });
  }
  function resumeGame() {
    if (busy) return;
    var s = savedGame();
    if (!s) { newGame(); return; }
    function go(g) {
      g.seed = s.seed; g.grid = s.grid.slice(); g.moves = s.moves || 0; g.elapsed = s.elapsed || 0; g.solved = false;
      openGame(g);
    }
    function scene(toastMsg) {
      var sc = makeScene(s.seed);
      go({ kind: 'scene', name: sc.name, img: sc.canvas, detail: null });
      if (toastMsg) showToast(toastMsg, 4500);
    }
    if (s.kind === 'unsplash') {
      setBusy(true, 'Loading your photo...');
      retrying(function (cb) { loadUnsplashImage(s.photo, cb); }, 2, 1500, function (r) {
        setBusy(false);
        if (!r) { scene('Could not reload your photo, so the board continues with a generated scene.'); return; }
        go({
          kind: 'unsplash', name: 'Photo', img: r.canvas, detail: r.score ? r.score.score : null,
          photo: s.photo, themeName: T.theme.name, themeEmoji: T.theme.emoji
        });
      });
    } else if (s.kind === 'scene') {
      scene();
    } else {
      // Saves from before the switch to Unsplash (Wikimedia Commons or Lorem Picsum photos).
      scene('Photos now come from Unsplash, so this saved board continues with a generated scene.');
    }
  }
  /* Dragging */
  function clearGhosts() { if (!drag) return; drag.ghosts.forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); }); drag.ghosts = []; }
  function updateGhost() {
    clearGhosts();
    if (!drag.dr && !drag.dc) { drag.plan = null; return; }
    var plan = P.planMove(G.grid, drag.cells, drag.dr, drag.dc), delta = drag.dr * COLS + drag.dc;
    drag.plan = plan;
    drag.cells.forEach(function (c) {
      var n = c + delta, d = document.createElement('div');
      d.className = 'g' + (plan.blocked ? ' bad' : '');
      d.style.transform = 'translate(' + (n % COLS) * G.cw + 'px,' + Math.floor(n / COLS) * G.ch + 'px)';
      board.appendChild(d); drag.ghosts.push(d);
    });
  }
  board.addEventListener('pointerdown', function (e) {
    if (!G || G.solved || drag || (e.button != null && e.button > 0)) return;
    var el = e.target.closest ? e.target.closest('.p') : null;
    if (!el) return;
    var cell = G.grid.indexOf(+el.dataset.id), cells = P.clusterOf(G.grid, cell);
    drag = { pid: e.pointerId, x0: e.clientX, y0: e.clientY, cells: cells, dr: 0, dc: 0, plan: null, ghosts: [] };
    cells.forEach(function (c) { G.els[G.grid[c]].classList.add('lift', 'rise'); });
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  board.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.pid) return;
    var dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    drag.cells.forEach(function (c) {
      G.els[G.grid[c]].style.transform = 'translate(' + ((c % COLS) * G.cw + dx) + 'px,' + (Math.floor(c / COLS) * G.ch + dy) + 'px)';
    });
    var off = P.clampOffset(drag.cells, Math.round(dy / G.ch), Math.round(dx / G.cw));
    if (off[0] !== drag.dr || off[1] !== drag.dc) { drag.dr = off[0]; drag.dc = off[1]; updateGhost(); }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    var d = drag, lifted = d.cells.map(function (c) { return G.els[G.grid[c]]; });
    clearGhosts(); drag = null;
    try { board.releasePointerCapture(e.pointerId); } catch (err) {}
    var plan = (e.type !== 'pointercancel' && (d.dr || d.dc)) ? P.planMove(G.grid, d.cells, d.dr, d.dc) : null;
    lifted.forEach(function (el) { el.classList.remove('lift'); });
    void board.offsetWidth;
    if (plan && plan.changed) {
      var before = {}, i;
      for (i = 0; i < N; i++) before[G.grid[i]] = P.bondCount(G.grid, i);
      G.grid = plan.newGrid; G.moves++;
      render(); updateHud(); saveGame();
      for (i = 0; i < N; i++) {
        var pid = G.grid[i];
        if (P.bondCount(G.grid, i) > before[pid]) {
          (function (el) { el.classList.remove('snap'); void el.offsetWidth; el.classList.add('snap'); setTimeout(function () { el.classList.remove('snap'); }, 700); })(G.els[pid]);
        }
      }
      if (P.isSolved(G.grid)) onSolved();
    } else {
      if (plan && plan.blocked) setHint('That would split a locked set and there is no room to move it. Try a different spot.', true);
      render();
    }
    setTimeout(function () { lifted.forEach(function (el) { el.classList.remove('rise'); }); }, 260);
  }
  board.addEventListener('pointerup', endDrag);
  board.addEventListener('pointercancel', endDrag);

  /* Timer */
  setInterval(function () {
    var now = performance.now();
    if (G && !G.solved && !$('gameView').hidden && !document.hidden) { G.elapsed += now - (G.last || now); updateHud(); }
    if (G) G.last = now;
  }, 250);
  setInterval(saveGame, 5000);
  // Installed/home-screen apps get suspended when backgrounded and can come back showing a
  // frozen paint of whatever was on screen before (e.g. an older mile count), even though the
  // saved progress itself is correct. Re-render the visible view with current data when the
  // app is restored from that state so the map never looks stuck.
  function refreshVisibleView() {
    if (!$('mapView').hidden) showMap();
    else if (!$('gameView').hidden && G) updateHud();
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveGame(); else refreshVisibleView(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) refreshVisibleView(); });
  window.addEventListener('pagehide', saveGame);
  window.addEventListener('resize', function () { if (G && !$('gameView').hidden) { layout(); render(); } });

  /* Win */
  var lastBefore = 0;
  function onSolved() {
    G.solved = true; lsDel(STORE_G);
    var c = cur(), before = c.miles, add = Math.min(100, TOTAL - before), wasDone = c.done;
    c.miles = before + add; J.solved++;
    var finished = c.miles >= TOTAL;
    if (finished) c.done = true;
    saveJ(); lastBefore = before;
    var reached = STOPS.filter(function (s) { return s.mi > before && s.mi <= c.miles; });
    var firstUnlock = finished && T === TRIPS[0] && !wasDone;
    var more = finished && TRIPS.some(function (tr) { return tr !== T && unlocked(tr); });
    var dest = STOPS[STOPS.length - 1];
    setTimeout(function () {
      $('winTitle').textContent = finished ? 'Trip complete' : 'Puzzle solved';
      $('winLine').textContent = finished
        ? 'You made it to ' + T.to + ', ' + fmt(TOTAL) + ' miles from ' + T.from + '.' + (firstUnlock ? ' ' + (TRIPS.length - 1) + ' new trips are unlocked.' : '')
        : reached.length ? 'You reached ' + reached.map(function (s) { return s.n + ', ' + s.s; }).join(' and ') + '.'
        : fmt(nextStop().mi - c.miles) + ' miles to ' + nextStop().n + ', ' + nextStop().s + '.';
      $('winStat').textContent = fmtTime(G.elapsed) + ' · ' + G.moves + (G.moves === 1 ? ' move' : ' moves') + ' · ' + fmt(TOTAL - c.miles) + ' miles to ' + dest.n;
      $('winNext').hidden = finished;
      $('winTrips').hidden = !more;
      $('winMap').className = more ? 'btn' : 'btn primary';
      $('winPhoto').hidden = true; $('winPhoto').removeAttribute('src'); $('winView').textContent = 'View puzzle';
      $('winCredit').innerHTML = G.kind === 'unsplash' ? unsplashCredit(G.photo) : '';
      $('winCredit').hidden = G.kind !== 'unsplash';
      $('win').hidden = false;
      (more ? $('winTrips') : $('winMap')).focus();
    }, 600);
  }
  $('winMap').onclick = function () { $('win').hidden = true; showMap(lastBefore); G = null; };
  $('winNext').onclick = function () { $('win').hidden = true; newGame(); };
  $('winTrips').onclick = function () { $('win').hidden = true; G = null; showTrips(); };
  $('winView').onclick = function () {
    var img = $('winPhoto');
    if (img.hidden) {
      if (!img.getAttribute('src') && G && G.img) img.src = G.img.toDataURL('image/jpeg', 0.85);
      img.hidden = false; $('winView').textContent = 'Hide puzzle';
    } else {
      img.hidden = true; $('winView').textContent = 'View puzzle';
    }
  };

  /* Game bar */
  $('backBtn').onclick = function () {
    if (G && !G.solved) saveGame();
    showMap();
  };
  var newTimer = 0;
  $('newBtn').onclick = function () {
    var b = $('newBtn');
    if (b.dataset.armed) { clearTimeout(newTimer); delete b.dataset.armed; b.textContent = 'New puzzle'; newGame(); }
    else {
      b.dataset.armed = '1'; b.textContent = 'Tap again to discard this one';
      newTimer = setTimeout(function () { delete b.dataset.armed; b.textContent = 'New puzzle'; }, 3000);
    }
  };

  showMap();
})();
</script>
